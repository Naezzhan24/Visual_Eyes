plugins {
    alias(libs.plugins.android.application)
}

// Firebase Crashlytics needs google-services.json (from the Firebase console)
// to initialize at runtime. Both plugins are gated on its presence so cloning
// this repo without that file still builds — just without crash reporting.
def googleServicesFile = file('google-services.json')
if (googleServicesFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

// Release signing credentials live in keystore.properties (gitignored, local-only)
// so the keystore password never ends up committed. Falls back to no signing
// config if the file is missing — debug builds are unaffected either way.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.example.visualeyes'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.visualeyes"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // JNA/Vosk ship native .so files for every ABI (incl. x86/x86_64
        // emulator archs, mips, plain armeabi). Real phones are arm64-v8a
        // or armeabi-v7a, so dropping the rest cuts a real chunk of size
        // with no functionality loss on physical devices.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // ── Vosk uses native .so libraries inside its AAR ─────────────────────────
    // Without this, you may get UnsatisfiedLinkError on some devices
    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
}

dependencies {

    // Android core
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0'

    // 🔥 PDF Reader
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // 🔥 DOCX Reader (Apache POI)
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    // 🔥 FIX for POI crashes
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'org.apache.xmlbeans:xmlbeans:5.2.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Networking
    implementation 'com.android.volley:volley:1.2.1'

    // Crash reporting — only reports once google-services.json is added
    // (see the conditional plugin block above); harmless no-op without it.
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    // ── Hybrid Speech: Vosk + Whisper ─────────────────────────────────────────

    // Vosk — on-device speech recognition (real-time partials)
    // Model: vosk-model-small-en-us-0.15 (40MB) → place in assets/
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.32'

    // OkHttp — for Whisper API calls (final accurate transcription)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}