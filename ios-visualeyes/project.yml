name: VisualEyes
options:
  bundleIdPrefix: com.visualed
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  VisualEyes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VisualEyes
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "VisualED uses your microphone so you can answer questions and read materials aloud by voice."
        NSSpeechRecognitionUsageDescription: "VisualED uses speech recognition to understand your voice commands and reading answers."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.visualed.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  VisualEyesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VisualEyesTests
    dependencies:
      - target: VisualEyes
schemes:
  VisualEyes:
    build:
      targets:
        VisualEyes: all
        VisualEyesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VisualEyesTests
    archive:
      config: Release
