name: Build debug APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/VisualEyes-debug.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-latest
          name: Latest debug APK
          body: Auto-built debug APK from commit ${{ github.sha }} on branch ${{ github.ref_name }}.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/VisualEyes-debug.apk
